
name: CITIZEN - Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compilar-apk:
    name: Crear APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obtener archivos del proyecto
        uses: actions/checkout@v4

      - name: Verificar estructura y JSON
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f www/playme.html
          python3 -m json.tool package.json
          python3 -m json.tool capacitor.config.json

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar juego
        run: npx cap sync android

      - name: Generar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CITIZEN_v37_ANDROID_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
